name: "Build"
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    branches: ["master", "dev"]
  pull_request:
    branches: ["master", "dev"]
    paths:
      - '**.rs'
      - '**.toml'
      - '**.yml'
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
      - name: "Install Rust toolchain"
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build
        run: cargo build --release
