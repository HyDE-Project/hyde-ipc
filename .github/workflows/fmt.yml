name: "Format"
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
    paths:
      - '**.rs'
      - '**.toml'
      - '**.yml'
jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
      - name: "Install Rust toolchain"
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: "Format"
        run: cargo fmt
